                  maxLength: 200
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                audience:
                  type: string
                  enum: [ALL, ROLE, USER]
                roles:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/UserRole'
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
