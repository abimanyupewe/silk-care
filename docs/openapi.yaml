      responses:
        '200':
          description: Statistik dashboard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/system:
    get:
      tags: [Admin]
      summary: Status sistem admin
      description: Latensi database dan status konfigurasi integrasi (hanya memeriksa env terisi).
      responses:
        '200':
          description: Status sistem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminSystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/payments/midtrans/webhook:
    post:
      tags: [Payments]
      security: []
      summary: Webhook Midtrans
      description: Signature SHA-512 diverifikasi sebelum Payment/Order diubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status_code, gross_amount, signature_key, transaction_status]
              properties:
                order_id:
                  type: string
                status_code:
                  type: string
                gross_amount:
                  type: string
                signature_key:
                  type: string
                transaction_status:
                  type: string
                fraud_status:
                  type: string
                transaction_id:
                  type: string
                payment_type:
                  type: string
      responses:
        '200':
          description: Webhook diproses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/cron/orders/expire:
    get:
      tags: [Cron]
      security: []
      summary: Batalkan pesanan kedaluwarsa dan bersihkan idempotency key
      description: 'Membutuhkan header `Authorization: Bearer $CRON_SECRET`.'
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hasil sweep.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [checked, expired, idempotencyKeysDeleted]
                    properties:
                      checked:
                        type: integer
                      expired:
                        type: integer
                      idempotencyKeysDeleted:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: |
        Cookie sesi Auth.js. Di produksi HTTPS, nama cookie menjadi
        `__Secure-authjs.session-token`.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]+$'
    MinRating:
      name: minRating
      in: query
      schema:
        type: number
        minimum: 0
        maximum: 5
    Latitude:
      name: lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: lng
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
    RadiusKm:
      name: radiusKm
      in: query
      schema:
        type: number
        minimum: 0
        exclusiveMinimum: true
        maximum: 500
    Day:
      name: day
      in: query
      description: '1 = Senin sampai 7 = Minggu.'
      schema:
        type: integer
        minimum: 1
        maximum: 7
    Time:
      name: time
      in: query
      description: Format HH:mm, zona waktu Asia/Jakarta.
      schema:
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    AvailableNow:
      name: availableNow
      in: query
      description: Filter jadwal yang aktif pada waktu Asia/Jakarta saat ini.
      schema:
        type: boolean
  headers:
    RetryAfter:
      description: Detik sampai rate limit direset.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: Bernilai `true` jika respons berasal dari replay idempotency.
      schema:
        type: string
        enum: ['true']
  responses:
    BadRequest:
      description: Permintaan tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Sesi tidak ada, tidak valid, atau sudah dicabut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role tidak diizinkan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflik state atau idempotency.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validasi body atau query gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Rate limit terlampaui.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Integrasi eksternal belum dikonfigurasi atau tidak tersedia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          description: |
            Kode mesin. Nilai umum: `BAD_REQUEST`, `UNAUTHORIZED`, `FORBIDDEN`,
            `NOT_FOUND`, `CONFLICT`, `VALIDATION_ERROR`, `RATE_LIMITED`,
            `INTERNAL_ERROR`, `BAD_GATEWAY`, `SERVICE_UNAVAILABLE`. Status lain memakai
            `HTTP_<status>`.
          example: NOT_FOUND
        details:
          nullable: true
          description: Detail tambahan, biasanya field errors untuk validasi.
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    UserProfile:
      type: object
      required: [id, email, name, role, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        emailVerified:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserRole:
      type: string
      enum: [PATIENT, DOCTOR, FACILITY, PHARMACY, ADMIN]
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    FacilityType:
      type: string
      enum:
        [HOSPITAL, CLINIC, LABORATORY, PHARMACY, PHYSIOTHERAPY, RADIOLOGY, FUNERAL_HOME, WELLNESS]
    OrderStatus:
      type: string
      enum: [PENDING, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [UNPAID, PAID, FAILED, REFUNDED]
    ConsultationType:
      type: string
      enum: [ONLINE, IN_PERSON]
    ConsultationStatus:
      type: string
      enum: [REQUESTED, CONFIRMED, COMPLETED, CANCELLED]
    ArticleStatus:
      type: string
      enum: [DRAFT, PENDING, PUBLISHED, REJECTED]
    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    NotificationType:
      type: string
      enum: [ACCOUNT, ORDER, REVIEW, ARTICLE, CONSULTATION, SYSTEM]
    ScheduleItem:
      type: object
      required: [id, dayOfWeek, startTime, endTime, isActive]
      properties:
        id:
          type: string
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startTime:
          type: string
          example: '09:00'
        endTime:
          type: string
          example: '17:00'
        isActive:
          type: boolean
    OperatingHour:
      type: object
      required: [id, dayOfWeek, openTime, closeTime, isClosed]
      properties:
        id:
          type: string
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        openTime:
          type: string
          example: '08:00'
        closeTime:
          type: string
          example: '21:00'
        isClosed:
          type: boolean
    Doctor:
      type: object
      required: [id, slug, specialty, user]
      properties:
        id:
          type: string
        slug:
          type: string
        specialty:
          type: string
        bio:
          type: string
          nullable: true
        experienceYears:
          type: integer
          nullable: true
        consultationFee:
          type: integer
          nullable: true
        city:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        distanceKm:
          type: number
          nullable: true
        photoUrl:
          type: string
          nullable: true
        videoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            image:
              type: string
              nullable: true
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
    Facility:
      type: object
      required: [id, slug, name, type]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/FacilityType'
        description:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        distanceKm:
          type: number
          nullable: true
        photoUrl:
          type: string
          nullable: true
        videoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        operatingHours:
          type: array
          items:
            $ref: '#/components/schemas/OperatingHour'
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              nullable: true
            image:
              type: string
              nullable: true
    Article:
      type: object
      required: [id, slug, title]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
          nullable: true
        content:
          type: string
          description: Hanya tersedia pada detail artikel.
        coverImage:
          type: string
          nullable: true
        coverPublicId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ArticleStatus'
        reviewNote:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        author:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            image:
              type: string
              nullable: true
    Product:
      type: object
      required: [id, slug, name, price, stock]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: integer
        stock:
          type: integer
        image:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        active:
          type: boolean
        facilityId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        facility:
          type: object
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            city:
              type: string
              nullable: true
            type:
              $ref: '#/components/schemas/FacilityType'
    Cart:
      type: object
      required: [items, totalItems, subtotal]
      properties:
        id:
          type: string
          nullable: true
        facilityId:
          type: string
          nullable: true
        facility:
          allOf:
            - $ref: '#/components/schemas/Facility'
            - nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalItems:
          type: integer
        subtotal:
          type: integer
    CartItem:
      type: object
      required: [id, quantity, product, subtotal, available]
      properties:
        id:
          type: string
        quantity:
          type: integer
        subtotal:
          type: integer
        available:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        product:
          $ref: '#/components/schemas/Product'
    OrderItem:
      type: object
      required: [id, productName, quantity, price]
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productSlug:
          type: string
          nullable: true
        productImage:
          type: string
          nullable: true
        quantity:
          type: integer
        price:
          type: integer
    Order:
      type: object
      required: [id, status, paymentStatus, total, items]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          type: integer
        recipientName:
          type: string
        recipientPhone:
          type: string
        shippingAddress:
          type: string
        shippingCity:
          type: string
        shippingPostalCode:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        facility:
          $ref: '#/components/schemas/Facility'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        statusHistory:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                $ref: '#/components/schemas/OrderStatus'
              note:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
              changedBy:
                type: object
                nullable: true
                properties:
                  name:
                    type: string
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
