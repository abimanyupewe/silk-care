openapi: 3.0.3
info:
  title: SILK API
  version: 1.0.0
  description: |
    Kontrak API backend SILK. Semua endpoint publik dan terautentikasi berada di bawah
    `/api/v1`, kecuali alur login Auth.js di `/api/auth`.

    ## Format respons
    - Sukses tunggal: `{ "data": ... }`
    - Sukses berdaftar: `{ "data": [...], "meta": { ... } }`
    - Gagal: `{ "error": "...", "code": "MACHINE_READABLE_CODE", "details"?: ... }`
    - `code` diturunkan dari status HTTP: `BAD_REQUEST`, `UNAUTHORIZED`, `FORBIDDEN`,
      `NOT_FOUND`, `CONFLICT`, `VALIDATION_ERROR`, `RATE_LIMITED`, `INTERNAL_ERROR`,
      `BAD_GATEWAY`, `SERVICE_UNAVAILABLE`.

    ## Autentikasi
    Login memakai Auth.js Credentials. Ambil CSRF token dari `/api/auth/csrf`, lalu POST ke
    `/api/auth/callback/credentials` dengan cookie jar yang sama. Cookie sesi bernama
    `authjs.session-token` (produksi HTTPS memakai `__Secure-authjs.session-token`).
    Semua endpoint bertanda `sessionCookie` membutuhkan cookie tersebut.

    ## Idempotency
    `POST /api/v1/orders` dan `POST /api/v1/consultations` menerima header opsional
    `Idempotency-Key`. Key yang sama dengan payload yang sama akan mengembalikan respons
    pertama (status dan body sama, header `Idempotent-Replayed: true`). Key yang sama dengan
    payload berbeda menghasilkan `409`. Key kedaluwarsa setelah 24 jam.

    ## Rate limit
    Endpoint sensitif mengembalikan `429` dengan header `Retry-After` saat limit terlampaui.
servers:
  - url: http://localhost:3000
    description: Development
  - url: https://silk.example.com
    description: Production placeholder
tags:
  - name: Auth.js
    description: Alur login berbasis cookie Auth.js.
  - name: Auth
    description: Registrasi, verifikasi email, reset password, dan profil akun.
  - name: Public Catalog
    description: Dokter, fasilitas, artikel, produk, dan pencarian publik.
  - name: Cart
  - name: Orders
  - name: Consultations
  - name: Medical Records
  - name: Doctor
  - name: Facility
  - name: Partner
  - name: Notifications
  - name: Reviews
  - name: Uploads
  - name: AI
  - name: Admin
  - name: Payments
  - name: Cron
  - name: Health
security:
  - sessionCookie: []
paths:
  /api/auth/csrf:
    get:
      tags: [Auth.js]
      security: []
      summary: Ambil CSRF token Auth.js
      responses:
        '200':
          description: CSRF token.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
  /api/auth/callback/credentials:
    post:
      tags: [Auth.js]
      security: []
      summary: Login dengan email dan password
      description: |
        Kirim sebagai `application/x-www-form-urlencoded`. Pada keberhasilan, Auth.js
        mengembalikan `302` dan menulis cookie sesi. Gunakan cookie jar yang sama dengan
        permintaan `/api/auth/csrf`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrfToken, email, password]
              properties:
                csrfToken:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                callbackUrl:
                  type: string
                json:
                  type: string
                  enum: ['true']
      responses:
        '302':
          description: Login berhasil atau gagal; periksa cookie sesi dan query error.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/health:
    get:
      tags: [Health]
      security: []
      summary: Health check database
      responses:
        '200':
          description: Database tersedia.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, database, latencyMs]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                      database:
                        type: string
                        enum: [up]
                      latencyMs:
                        type: integer
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/openapi:
    get:
      tags: [Health]
      security: []
      summary: Spesifikasi OpenAPI (YAML)
      responses:
        '200':
          description: Dokumen OpenAPI 3.0.3.
          content:
            application/yaml:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Registrasi akun pasien
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                phone:
                  type: string
                  minLength: 8
                  maxLength: 20
      responses:
        '201':
          description: Akun dibuat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/verify-email/request:
    post:
      tags: [Auth]
      security: []
      summary: Kirim ulang email verifikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Pesan generik untuk mencegah enumerasi email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/verify-email/confirm:
    post:
      tags: [Auth]
      security: []
      summary: Konfirmasi email dengan token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        '200':
          description: Email terverifikasi atau sudah terverifikasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Minta token reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Pesan generik untuk mencegah enumerasi email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Reset password dengan token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: Password direset; sesi lama dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Sesi pengguna saat ini
      responses:
        '200':
          description: Data sesi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me:
    get:
      tags: [Auth]
      summary: Profil akun sendiri
      responses:
        '200':
          description: Profil akun.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Auth]
      summary: Ubah profil akun sendiri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                  minLength: 8
                  maxLength: 20
                  nullable: true
                image:
                  type: string
                  minLength: 1
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: Profil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/change-password:
    post:
      tags: [Auth]
      summary: Ubah password dan cabut sesi lama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: Password diubah; semua token lama tidak valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      reauthenticate:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/doctors:
    get:
      tags: [Public Catalog]
      security: []
      summary: Daftar dokter terverifikasi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
        - name: specialty
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: minFee
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxFee
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                newest,
                name,
                fee_asc,
                fee_desc,
                experience_desc,
                rating_desc,
                review_desc,
                distance_asc
              ]
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Time'
        - $ref: '#/components/parameters/AvailableNow'
      responses:
        '200':
          description: Daftar dokter.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Doctor'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/doctors/{slug}:
    get:
      tags: [Public Catalog]
      security: []
      summary: Detail dokter
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detail dokter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Doctor'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/facilities:
    get:
      tags: [Public Catalog]
      security: []
      summary: Daftar fasilitas terverifikasi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/FacilityType'
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, name, city, rating_desc, review_desc, distance_asc]
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Time'
        - $ref: '#/components/parameters/AvailableNow'
      responses:
        '200':
          description: Daftar fasilitas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/facilities/{slug}:
    get:
      tags: [Public Catalog]
      security: []
      summary: Detail fasilitas
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detail fasilitas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles:
    get:
      tags: [Public Catalog]
      security: []
      summary: Daftar artikel publik
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, title]
      responses:
        '200':
          description: Daftar artikel.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/articles/{slug}:
    get:
      tags: [Public Catalog]
      security: []
      summary: Detail artikel publik
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detail artikel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Article'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products:
    get:
      tags: [Public Catalog]
      security: []
      summary: Daftar produk publik
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, name, price_asc, price_desc]
      responses:
        '200':
          description: Daftar produk.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{slug}:
    get:
      tags: [Public Catalog]
      security: []
      summary: Detail produk publik
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detail produk.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/search:
    get:
      tags: [Public Catalog]
      security: []
      summary: Pencarian lintas dokter, fasilitas, artikel, dan produk
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: type
          in: query
          schema:
            type: string
            enum: [DOCTOR, FACILITY, ARTICLE, PRODUCT]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Time'
        - $ref: '#/components/parameters/AvailableNow'
      responses:
        '200':
          description: Hasil pencarian.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    type: object
                    additionalProperties: true
                    required: [query, total, limitPerType, counts]
                    properties:
                      query:
                        type: string
                      total:
                        type: integer
                      limitPerType:
                        type: integer
                      counts:
                        type: object
                        properties:
                          doctors:
                            type: integer
                          facilities:
                            type: integer
                          articles:
                            type: integer
                          products:
                            type: integer
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Ambil keranjang
      responses:
        '200':
          description: Keranjang (kosong jika belum ada).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      summary: Kosongkan keranjang
      responses:
        '200':
          description: Keranjang kosong.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Tambah produk ke keranjang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                  minLength: 1
                  maxLength: 100
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
      responses:
        '200':
          description: Keranjang diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Ubah jumlah item keranjang
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
      responses:
        '200':
          description: Keranjang diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
